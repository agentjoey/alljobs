<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>AllJobs Planning Core — Paper Workbench Mockup</title>
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!--
      THESIS: AllJobs is a paper workbench where Backlog and Task ledgers own the reading plane; it refuses the dashboard card wall, the decorative diagram, and the scroll-narrative portfolio page.
      OWN-WORLD: warm cream paper, ink General Sans, IBM Plex Mono for IDs/paths/digests, hairline rules, one amber accent reserved for provenance and the current position; hatch fill marks external read-only custody, solid fill marks native writable custody.
      STORY: Joey scans the work ledger, verifies who owns each fact from the amber provenance strip, and takes one safe next action behind an explicit Human Gate.
      FIRST VIEWPORT: a quiet header over the amber provenance strip, then a dominant ledger with a compact facts column; the primary action sits beside the ledger heading.
      FORM: user-pinned pleurat.com-derived paper workbench, Human Owner decision 2026-08-27; supersedes the Star Atlas revision 2 world; no concept roll — pinned direction beats the roll.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <a class="skip-link" href="#main-content">Skip to planning content</a>
    <div class="mockup-banner" role="note">
      <span>Task 1 rendered mockup · revision 3</span>
      <span>Synthetic planning data · no canonical writes</span>
    </div>
    <header class="app-header">
      <button class="brand" type="button" data-route="portfolio" aria-label="AllJobs portfolio">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="7" y="7" width="18" height="18"/><path d="M7 16h5M20 16h5M16 7v5M16 20v5"/></svg>
        <span>alljobs</span>
      </button>
      <nav class="primary-nav" aria-label="Primary navigation">
        <button type="button" data-route="portfolio">Portfolio</button>
        <button type="button" data-route="projects">Projects</button>
        <button type="button" data-route="tasks">Tasks</button>
        <button type="button" data-route="register">Register</button>
        <button type="button" data-route="archived">Archived</button>
      </nav>
      <div class="header-search">
        <div class="universal-search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" id="global-search-input" placeholder="Search tasks, backlog, projects... (⌘K)" aria-label="Universal search" />
          <kbd aria-hidden="true">⌘K</kbd>
        </div>
      </div>
      <div class="header-status">
        <span class="status-dot status-dot--healthy" aria-hidden="true"></span>
        <span><strong>4/4</strong> sources</span>
        <button class="icon-button" type="button" data-action="refresh" aria-label="Refresh project sources">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
        </button>
      </div>
    </header>

    <div id="status-strip" class="status-strip" aria-label="Provenance and freshness"></div>

    <div class="scenario-bar">
      <label for="scenario-select">Preview state</label>
      <select id="scenario-select" aria-describedby="scenario-help"></select>
      <span id="scenario-help">State controls are Task 1 evidence and will not ship as product chrome.</span>
    </div>

    <main id="main-content" tabindex="-1"></main>

    <div class="live-region" aria-live="polite" aria-atomic="true"></div>
    <dialog id="action-dialog" aria-labelledby="dialog-title">
      <form method="dialog" class="dialog-form">
        <p class="dialog-plate">Human gate · recheck required</p>
        <h2 id="dialog-title">Confirm action</h2>
        <div id="dialog-body"></div>
        <div class="dialog-actions">
          <button class="button button--quiet" value="cancel">Cancel</button>
          <button class="button button--primary" id="dialog-confirm" value="confirm">Confirm</button>
        </div>
      </form>
    </dialog>
    <script src="app.js"></script>
  </body>
</html>
