        evidence: 打回项 #1（受控 select 显示与 state 脱节）已按真实触发点修复，其余 reviewer 已复核通过部分未动。  【修复】components/ledger/primitives/today-sheet.tsx：在 <form> 上挂原生 reset 事件监听（useEffect + addEventListener），回调里 queueMicrotask(() => 强制重渲染)。原生 reset() 先派发 reset 事件、后还原控件，微任务必然排在 reset() 整步与当前 commit 之后——那次重渲染把受控值重新施加到 DOM。先确认了顺序再动手：隐式 reset 是 React commit layout 阶段 fiber.stateNode.reset()；action 里 rAF 回调跑在 reset 之前（上一轮失败根因）；React 对 action 表单的隐式 reset 不派发合成 onReset（prop 挂法 handler 不执行），原生监听才命中真实触发点。这些已写进代码注释。  【回归测试（上一轮缺口）】新增 components/ledger/primitives/today-sheet.dom.test.tsx（jsdom + createRoot，真跑 submit → 隐式 reset 全生命周期，mock server action）：成功落账后断言 select[name=slug].value==="diskwatch"、select[name=agent].value==="kimi"、文本清空；随后完全不碰 select 只敲 q 再提交，断言两次 quickAdd 调用的 FormData 都是 slug=diskwatch/agent=kimi。红绿验证：git checkout -- today-sheet.tsx 回到旧 rAF 实现后该测试 FAIL（断言在 agent==="kimi" 处红），恢复修复后 PASS——不是摆设测试。rAF 在测试中 polyfill 为「只登记不回调」，确保断言不依赖任何帧回调救场。  【CDP 实测原文（最终 build + next start -p 3471 + headless Chrome，脚本 /tmp/quickadd-verify.mjs）】选 diskwatch/kimi、输入 syncprobe-4、真实 Enter 键（rawKeyDown+char+keyUp，纯 keyDown 不触发隐式提交）： - 第一笔落底行: "22:26diskwatchkimisyncprobe-4"（data 原文：- 22:26 diskwatch @kimi syncprobe-4） - 落账后 200ms×20 连续采样 4s 原文（20 次全部一致，无一次脱节）：   t=200ms slug="diskwatch" agent="kimi" text="" focus=text   t=400ms slug="diskwatch" agent="kimi" text="" focus=text   t=600ms slug="diskwatch" agent="kimi" text="" focus=text   t=800ms slug="diskwatch" agent="kimi" text="" focus=text   t=1000ms slug="diskwatch" agent="kimi" text="" focus=text   t=1200ms slug="diskwatch" agent="kimi" text="" focus=text   t=1400ms slug="diskwatch" agent="kimi" text="" focus=text   t=1600ms slug="diskwatch" agent="kimi" text="" focus=text   t=1800ms slug="diskwatch" agent="kimi" text="" focus=text   t=2000ms slug="diskwatch" agent="kimi" text="" focus=text   t=2200ms slug="diskwatch" agent="kimi" text="" focus=text   t=2400ms slug="diskwatch" agent="kimi" text="" focus=text   t=2600ms slug="diskwatch" agent="kimi" text="