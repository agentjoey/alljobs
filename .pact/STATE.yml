ted flag — vercel/cloudflare/github implemented:false), strict monitoringBindingSchema (lowercase stable ids, per-provider resource_id grammar: railway 3-UUID locator, fly/neon slugs, supabase 20-char ref, bounded opaque for extensions; HTTPS console_url host allowlist with userinfo rejection; required_signals ⊆ supported ∪ probe-derived runtime, extension providers reject any required signal), strict probe schema (relative path only, GET/HEAD, 1–10 unique statuses 100–599, timeout 250–30000ms), schema-version-1 MonitoringSnapshot with closed collector taxonomy, deployment/runtime/usage/platform-incident/freshness signals, machine-readable reasons; usage measures enforce no synthetic values (not_available forbids value), cost requires currency + exact alignment, period ordering. validateMonitoringBindingsAgainstConfig flags credential_ref_unknown / credential_provider_mismatch / probe_host_ref_unknown without ever touching token values.  【Registry + config】projectRegistrySchema gains optional strict monitoring.bindings (max 16, duplicate-id rejection). Control Host config gains optional strict monitoring block: enabled default false, refreshIntervalSeconds 60–86400 default 300, concurrency 1–4 default 3, credentials Record keyed by lowercase ref with provider enum + tokenEnv /^[A-Z][A-Z0-9_]*$/ (literal token keys rejected via .strict()), probeAllowedHosts exact HTTPS origins (path/query/userinfo/trailing-dot rejected). loadControlHostConfig resolves stateDir/monitoringStateDir strictly as <ALLJOBS_HOME>/state[/monitoring] and creates only those descendants (temp-home test proves). Note: ControlHostResolvedPaths.stateDir/monitoringStateDir are optional on the interface (always set by loadControlHostConfig) so four pre-existing test files outside the task file list that construct the shape literally keep typechecking — flagging for reviewer awareness. config/alljobs.example.json keeps monitoring disabled with fake env name EXAMPLE_ONLY_MONITORING_TOKEN_ENV and .invalid origin; a test parses the example and asserts no token-shaped values.  【Boundaries】No z.any(), no free-form endpoints, no secret values in any contract; no production credentials, no push/deploy. Untouched: all other tasks' files and Human-owned files.
