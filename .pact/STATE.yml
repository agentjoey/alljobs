structor' 均断言 state==='unavailable'（修复前实测返回 [Function toString]）。  【RED→GREEN】RED（修 fixtures + 加回归测试后、改实现前）：3 files failed / 10 failed | 46 passed — fly 侧全部 collect 用例因数组 fixtures 撞 record schema 失败（含 conformance 套件与新 documented-shape 测试），railway 原型链测试失败且实际值确为 [Function toString]。GREEN（最终代码）：npm test -- lib/monitoring/adapters/railway lib/monitoring/adapters/fly lib/monitoring/adapters/conformance.test.ts → Test Files 3 passed (3)，Tests 56 passed (56)（较上轮 53 +3）；npm run typecheck (tsc --noEmit) → exit 0。全量 npm test → 70 files / 661 passed（较 658 +3）。npm run lint → 0 errors，66 warnings 全部既有。git diff --check → exit 0。fixture no-token 扫描（两套测试内建）在重生成文件上通过。  【边界】仅碰 spec 列出文件；无凭证/真实网络（OpenAPI doc 为只读公开文档拉取）；未 push/deploy。
