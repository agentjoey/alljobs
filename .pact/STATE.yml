        evidence: 三项打回全部实机复验修复；另有一处方案性偏差需 reviewer 重点确认（见【2】末）。  【1】§5 安全边界改写 + start:prod 绑回环（实机验证） - package.json: start:prod = "next start -p 3456 -H 127.0.0.1"（spec 允许的唯一脚本，仅改内容）。 - 实测（最终 build 后 npm run start:prod）：lsof → TCP 127.0.0.1:3456 (LISTEN) 仅回环；Next 打印 Local/Network 均 http://127.0.0.1:3456；curl 127.0.0.1:3456 → 200；curl 192.168.0.14:3456（本机 LAN IP）→ 000 connection refused。修复前 reviewer 测得的通配绑定已消失。 - docs/deploy.md §5 边界①改为事实：Next --hostname 默认 0.0.0.0（引 node_modules/next/dist/docs/01-app/03-api-reference/06-cli/next.md），必须显式 -H 127.0.0.1 才能让 tunnel 成为唯一入口，并注明「改脚本时请勿去掉这个参数」；§1 start:prod 说明同步更新。launchd plist 经 npm run start:prod 自动继承该绑定，plist 未动。  【2】§3 cloudflared 常驻定案：config 放 ~/.cloudflared/config.yml，但常驻机制两个建议方案实测都坏，改用第三个方案（偏差，请重点审） - 配置路径按建议定案：~/.cloudflared/config.yml（与 cert.pem/凭证同目录），deploy/cloudflared-config.example.yml 头注释原本就是此路径，口径已一致；§3 删除 /opt/homebrew/etc 与全部 sudo。 - 但常驻机制实测（cloudflared 2026.3.0）：(a) brew services start cloudflared（不带 sudo）→ service 定义裸跑二进制，exit 1，日志 "Use cloudflared tunnel run to start tunnel"；(b) cloudflared service install → 生成的 ~/Library/LaunchAgents/com.cloudflare.cloudflared.plist 同样是裸跑无参数，exit 1 崩溃循环（err.log 连续 6 条同样消息）。两路均亲测失败后已清理干净（brew services stop + 删 homebrew.mxcl plist；cloudflared service uninstall）。 - 采用本机已被验证的既有模式（com.home.cloudflared / com.fututrading.cloudflared 两个在跑的 agent 均为自定义 plist 显式带 tunnel --config … run）：新增模板 deploy/com.agentjoey.cloudflared.plist（占位符 <CLOUDFLARED_BIN>/<USERNAME>，RunAtLoad+KeepAlive，日志 ~/.cloudflared/logs/alljobs.{log,err}），§3 与 §6 全部改为 launchctl load/unload 该 plist，并加「为什么不用 brew services / service install」说明块。spec 交付物清单只列了两个模板，此第三个文件是为满足「tunnel 真的起来」所必需，请 reviewer 定夺。 - 实机验证 tunnel 真起来了：真实执行 tunnel create alljobs（cert.pem 本已存在，无需 Human login）→ 写入真实 ~/.cloudflared/config.yml → sed 替换模板装到 ~/Library/LaunchAgents/ → launchctl load → 日志 4 条 Registered tunnel connection（lax10/lax01/lax01/lax09，quic）；cloudflared tunnel list 显示 alljobs = 38eb108b-dc5e-4e51-8ffd-4c4caf7a4cec，CONNECTIONS=2xlax01,1xlax09,1xlax10；launchctl list 状态 0。未执行 route dns（见【3】暴露窗口），公网侧不可达属预期。  【3】§3 验证预期 302→200 + 暴露窗口警告 - 验证段改为「Access 配好之前返回 200」；新增 ⚠️ 警告块：route dns 一执行即对整个互联网零鉴权敞开，推荐先做完 §4 Access 策略再回来跑 route dns，或期间先别执行。  验收命令（全部跑在最终文件之后）： - npm run lint：0 errors，1 warning（scripts/shot.mjs:49 既有，非本任务文件） - npm run build：Next.js 16.3.0 Turbopack ✓ Compiled / ✓ TypeScript / ✓ 静态生成，四路由全 ƒ - npm test：Test Files 10 passed (10)，Tests 102 passed (102) - 模板 lint：plutil -lint 两个 plist 原文与 sed 替换后均 OK；cloudflared ingress validate yml 原文/替换后/实机 ~/.cloudflared/config.yml 三处均 OK  git status（增量）：M docs/deploy.md / M package.json / ?? deploy/com.agentjoey.cloudflared.plist。未碰 app/、lib/、components/ 及其他 task 文件。  机器现状备注：com.agentjoey.cloudflared LaunchAgent 仍在跑（tunnel 已上线、无 DNS 路由故公网不可达），属部署目标状态，未卸载；验证用的手动 next server 已停，3456 端口已释放。实机 ~/.cloudflared/config.yml 已按模板写好（tunnel id 38eb108b-dc5e-4e51-8ffd-4c4caf7a4cec）。
