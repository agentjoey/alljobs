        spec: .pact/tasks/r5-application-monitoring-task-4.md
        evidence: Task 4 (r5-collector) complete. Commit 6c4f3e5 on codex/r5-application-monitoring, exact spec files only (12 created, 0 modified; git status clean after commit).  【RED evidence】Tests written first (5 test files), impl absent: npm test -- lib/monitoring/adapters/conformance.test.ts lib/monitoring/collector → Test Files 5 failed (5), Tests no tests (unresolved ./conformance, ./fixture, ./credentials, ./backoff, ./probe, ./collect).  【GREEN evidence (final code)】Same command → Test Files 5 passed (5), Tests 99 passed (99). npm run typecheck (tsc --noEmit) → exit 0. Full suite npm test → 68 files / 617 passed (was 63/518 at Task 3: +5 files/+99 tests). npm run lint → 0 errors, 66 warnings (baseline unchanged; two new unused-import warnings found and fixed). git diff --check → exit 0.  【contracts.ts】MonitoringAdapter contract (design §13): fixed provider/version, capabilities(binding) declaring resourceKinds/supportedSignals/consoleHosts/apiHosts/methods/per-signal signalMaxAgeSeconds, validateBinding, collect(input, signal). Closed AdapterError taxonomy (authentication_failed/permission_denied/rate_limited+retryAfterSeconds/timeout/malformed_response/unsupported_capability). Injected FetchLike/DnsLookup seams; opaque CredentialHandle (token behind closure only). Bounds: ADAPTER_MAX_RESPONSE_BYTES 1MB, ADAPTER_MAX_REQUEST_BODY_BYTES 16KB, ADAPTER_REQUEST_TIMEOUT_MS 15s, request-header allowlist (authorization/content-type/accept).  【conformance.ts + fixture.ts】runAdapterConformance battery: capabilities declared (implemented, apiHosts, closed methods); validateBinding accepts valid / rejects invalid resource kind / rejects unsupported required signal; every recorded request asserted HTTPS + declared host + declared method + abort signal + header allowlist + GET/HEAD no body + bounded POST body; result schema-validated through strict domain schemas with version match; all timestamps ≤ receipt time; recursive secret scan (canary token + forbidden key pattern token|secret|authorization|password|cookie|header|raw|body|log); oversized response must fail as AdapterError malformed_response; pre-aborted signal must fail as AdapterError timeout; raw transport throw must be wrapped into the closed taxonomy. Non-empty violations throw ConformanceViolation with the full list. Fixture adapter passes the whole battery (test asserts all 12 check names); 7 deliberately-broken adapters each fail with the expected violation (undeclared host, missing signal, unexpected header, schema-invalid result, serialized credential, raw throw, ignored abort). Fixture maps 401/403/429(Retry-After parsed)/other to the closed taxonomy and enforces size limits.  【credentials.ts】resolveMonitoringCredential: credential_ref_unknown / credential_provider_mismatch / credential_env_missing / credential_env_empty; messages name ref + env var NAME only (tests assert token canary absent from thrown String/JSON forms). Handle: closure-held token, non-enumerable toJSON/toString/nodejs.util.inspect.custom redaction; JSON.stringify/String/inspect/own-key scan all token-free; token never enters snapshot-shaped serialization.  【backoff.ts】ProviderBackoff with injected clock + jitter: equal-jitter exponential (base*2^(n-1), tests pin 30/60/120/240 at random 0/1), maxDelay cap, per-provider isolation, success reset, Retry-After honored as a floor (max of computed and provider value), per-binding minimum interval, provider_backoff reported before minimum_interval when both apply.  【probe.ts】SSRF boundary (design §12.2): host_ref → exact allowlisted origin only (unknown ref rejected); HTTPS only; userinfo rejected; relative path revalidated (//, .., backslash, whitespace, non-/ prefix rejected) with origin-equality check after resolution; IP-literal and DNS-answer screening over loopback/private (10/8, 172.16/12, 192.168/16)/link-local/CGNAT 100.64/10/benchmark 198.18/15/multicast 224/4 + ff00::/8/reserved 240/4/unspecified, full IPv6 parser incl. ::ffff:a.b.c.d mapped screening (19 literal cases + 15 DNS-answer cases tested, one bad answer fails all); redirect: manual never followed (single request even on cross-origin 301; configured expected 302 works as intentional Access redirect evidence); GET/HEAD only, no custom headers, no body; AbortSignal.timeout deadline; content-length > 1MB rejected as probe_oversize_metadata; body never read (bodyUsed===false asserted on success and oversize paths); transport errors normalized (timeout vs probe_fetch_failed) without echoing internals (secret-canary test).  【collect.ts】runCollectionCycle: cycle id derived from injected clock; previous generation read once via readCurrentProjection for carry-forward; bounded concurrency pool (test proves max in-flight ≤ 2 with 4 targets); per-binding flow = unsupported-provider short-circuit (no requests) → backoff+min-interval check (skip carries previous collector truth verbatim; manual cycle 10s after success is skipped_min_interval and stays healthy/complete) → credential resolution (auth failure isolation, secret-free detail) → adapter collect under outer 60s abort → probe override of runtime evidence with consecutive_failures tracking (transient 1 → warning, confirmed 2 → critical runtime_unhealthy_confirmed) → schema-parsed evaluated snapshot via evaluateAttention/deriveFreshnessSignal. Adapter failures isolated: timeout on railway leaves neon healthy, index publishes partially_complete, failed binding retains dep id + observed_at, freshness delayed, attention watch/collection_delayed; first-collection failure publishes null-signal unknown with never_collected freshness; rate_limited with Retry-After 900 blocks the next cycle's provider call entirely (zero fixture requests observed). MonitoringCollector enforces global single-flight (second collect() returns {status:"collecting"}) and owns a persistent backoff across cycles. Unknown errors normalize to fixed "unexpected collector error" — no internals echoed.  【Boundaries】No real network/DNS in any test (all injected); no credentials touched; no other task files; nothing pushed/deployed.
