        evidence: Task 2 (r5-attention) complete. Commit 1ec42bb on codex/r5-application-monitoring, exact spec files only (git status clean after commit).  【RED→GREEN】RED: npm test -- lib/monitoring/domain/attention.test.ts → 1 failed / no tests (unresolved ./attention, fixtures+tests written first). GREEN: same command → 1 passed / 66 tests passed.  【Evaluator (lib/monitoring/domain/attention.ts)】Pure functions, injected `now`; no clock/fs/config/network. evaluateAttention(binding, collector, deployment, runtime, usage, platform_incident, freshness, adapter_capabilities, now) → { attention, leading, reasons }. Precedence critical>warning>unknown>watch>healthy via severity rank; reasons sorted by rank then stable code sort, leading = first; every applicable reason retained; no numeric composite score (test asserts result keys are exactly attention/leading/reasons and JSON contains no "score"). Reason codes (all with stable code, affected dimension, severity, human-safe secret-free summary, evidence timestamp): collector_authentication_failed / collector_permission_denied (unknown per required signal, watch when no required signals; values never evaluated after invalidation), unsupported_required_signal (unknown; runtime satisfiable via binding probe), first_collection / stale_max_age_exceeded (unknown; expired values never evaluated as truth — deployment_failed from a stale retained value is suppressed), collection_delayed (watch; retained value inside max age still evaluated), required_signal_missing (unknown), deployment_failed (warning) / deployment_unavailable (unknown when required), runtime_unhealthy_confirmed (critical when required, warning when optional; threshold CONFIRMED_CONSECUTIVE_FAILURES=2) / runtime_unhealthy_transient (warning) / runtime_degraded (warning required, watch optional) / runtime_unexpected_stopped (critical required: stopped/expected_idle under always-on = explicitly unavailable; scale-to-zero/scheduled/manual treat them as policy-matching healthy) / runtime_state_unknown (unknown when required), allowance_watch (>=75%<90%) / allowance_near_limit (>=90%<100%) / quota_exhausted (>=100% warning) / quota_exhausted_with_impact (>=100% + runtime unhealthy/degraded → critical) — percentage computed as (value*100)/allowance so 75/90/100 boundaries are exact; allowance 0 with value>0 = exhausted; measures without allowance never enter thresholds; usage_unavailable (unknown when required usage has no available measure), platform_incident_active (warning; statuses resolved/completed/closed are inactive; missing optional incident never downgrades). deriveSignalFreshness/deriveFreshnessSignal: never_collected/current/delayed/expired, age == max_age boundary is current, expired beats delayed, future timestamps clamped.  【Fixtures (fixtures.ts)】Reusable builders for binding (railway+probe / neon), collector, deployment, runtime, usage measure, platform incident, signal freshness, freshness, and full snapshot — every builder parses through the strict Task 1 schemas before returning, so fixtures can only emit valid schema-version-1 objects. Fixed timeline constants (FIXTURE_NOW etc.).  【Tests (66)】Table-driven coverage of every spec-listed case: 5-case precedence table, reason retention + severity-then-code ordering + determinism (double evaluation toEqual), no-score, required vs optional (not_available optional healthy / required unknown), first collection, auth+permission invalidation (secret-free summaries asserting no token|secret|bearer while credential_ref is named), stale expiry (stale value never evaluated), delayed inside max age, 8-row allowance band table at 74.99/75/89.99/90/99.99/100/120/zero-allowance, quota exhaustion with/without impact (healthy vs unhealthy vs degraded runtime), transient vs confirmed probe failures (undefined/1/2/6 consecutive), deployment/runtime disagreement both directions (succeeded+critical probe without rewriting deployment truth; failed+healthy runtime), platform incident active/resolved/optional-missing/required-missing, 11-row expected-runtime policy matrix across all four policies, unsupported required/optional, evaluation output round-trips through monitoringSnapshotSchema, and a 7-row deriveSignalFreshness boundary table plus deriveFreshnessSignal collector-failure propagation.  【Acceptance commands (final code)】npm test -- lib/monitoring/domain/attention.test.ts → 1 file / 66 passed. npm run typecheck (tsc --noEmit) → exit 0. Full suite npm test → 59 files / 466 passed. npm run lint → 0 errors, 66 pre-existing warnings (none in new files). git diff --check → clean.  【Boundaries】Only the three spec-listed files created; no other task's files touched; no credentials, network, or provider calls; not pushed/deployed.
