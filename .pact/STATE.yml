lax01,1xlax09,1xlax10；launchctl list 状态 0。未执行 route dns（见【3】暴露窗口），公网侧不可达属预期。  【3】§3 验证预期 302→200 + 暴露窗口警告 - 验证段改为「Access 配好之前返回 200」；新增 ⚠️ 警告块：route dns 一执行即对整个互联网零鉴权敞开，推荐先做完 §4 Access 策略再回来跑 route dns，或期间先别执行。  验收命令（全部跑在最终文件之后）： - npm run lint：0 errors，1 warning（scripts/shot.mjs:49 既有，非本任务文件） - npm run build：Next.js 16.3.0 Turbopack ✓ Compiled / ✓ TypeScript / ✓ 静态生成，四路由全 ƒ - npm test：Test Files 10 passed (10)，Tests 102 passed (102) - 模板 lint：plutil -lint 两个 plist 原文与 sed 替换后均 OK；cloudflared ingress validate yml 原文/替换后/实机 ~/.cloudflared/config.yml 三处均 OK  git status（增量）：M docs/deploy.md / M package.json / ?? deploy/com.agentjoey.cloudflared.plist。未碰 app/、lib/、components/ 及其他 task 文件。  机器现状备注：com.agentjoey.cloudflared LaunchAgent 仍在跑（tunnel 已上线、无 DNS 路由故公网不可达），属部署目标状态，未卸载；验证用的手动 next server 已停，3456 端口已释放。实机 ~/.cloudflared/config.yml 已按模板写好（tunnel id 38eb108b-dc5e-4e51-8ffd-4c4caf7a4cec）。
